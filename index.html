<!DOCTYPE html>
<html lang="it">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Attendere...</title>

  <!--
    Cette page est uniquement une page de redirection.
    Elle ne doit pas être indexée par les moteurs de recherche.
  -->
  <meta
    name="robots"
    content="noindex, nofollow, noarchive"
  >

  <!--
    FALLBACK POUR LES VISITEURS QUI ONT DÉSACTIVÉ JAVASCRIPT

    Si JavaScript est désactivé, le visiteur sera envoyé
    vers le premier article de la liste.
  -->
  <noscript>

    <meta
      http-equiv="refresh"
      content="0;url=https://www.laubes.site/2026/09/ho-scoperto-per-caso-questo-angolo.html"
    >

  </noscript>


  <!--
    ============================================================
    STYLE
    ============================================================
  -->

  <style>

    html,
    body {

      margin: 0;

      padding: 0;

      width: 100%;

      height: 100%;

      background: #ffffff;

      overflow: hidden;

    }

  </style>

</head>


<body>


<script>

(function () {

  /*
   * ============================================================
   *              LISTE DE TES ARTICLES
   * ============================================================
   *
   * Tu peux mettre :
   *
   * 5 articles
   * 10 articles
   * 20 articles
   * 30 articles
   * 50 articles
   * 100 articles
   *
   * ou davantage.
   *
   * Tu dois uniquement ajouter ou supprimer les URLs
   * dans cette liste.
   */


  const URLS = [

    "https://quoraads.blogspot.com/2026/10/un-homme-sauve-une-cabine-telephonique-historique-sur-une-ile-ecossaise.html",

    "https://quoraads.blogspot.com/2026/10/le-pere-de-zendaya-quitte-son-metier-pour-devenir-son-manager.html",

    "https://quoraads.blogspot.com/2026/10/10-ans-au-refuge-ce-chien-attend-toujours-une-famille.html",

    "https://quoraads.blogspot.com/2026/10/chihuahua-sauve-rejoint-la-garde-nationale-mexicaine-avec-son-equipement-tactique.html",

    "https://quoraads.blogspot.com/2026/10/le-pere-de-zendaya-quitte-son-metier-pour-devenir-son-manager.html"

    "https://quoraads.blogspot.com/2026/10/un-homme-sauve-une-cabine-telephonique-historique-sur-une-ile-ecossaise.html"

  "https://quoraads.blogspot.com/2026/10/condamnee-pour-avoir-empoisonne-son-bebe-innocentee-grace-a-une-maladie-genetique-rare.html"

  "https://quoraads.blogspot.com/2026/10/38-chiens-sauves-par-des-pecheurs-en-pleine-mer.html"

  "https://quoraads.blogspot.com/2026/10/chris-evans-offre-le-bouclier-de-captain-america-a-un-jeune-heros-de-6-ans.html"

  "https://quoraads.blogspot.com/2026/10/bebe-couvert-de-fourmis-adopte-par-jimmy-amisial-en-haiti.html"


    /*
     * ========================================================
     * AJOUTE TES AUTRES ARTICLES ICI
     * ========================================================
     *
     * Exemple :
     *
     * "https://www.laubes.site/2026/09/article-6.html",
     * "https://www.laubes.site/2026/09/article-7.html",
     * "https://www.laubes.site/2026/09/article-8.html",
     *
     * etc.
     *
     * jusqu'à 50 articles ou plus.
     */


  ];


  /*
   * ============================================================
   * VÉRIFICATION DE LA LISTE
   * ============================================================
   *
   * On vérifie que la liste contient au moins une URL.
   */


  if (
    !Array.isArray(URLS) ||
    URLS.length === 0
  ) {

    return;

  }


  /*
   * ============================================================
   * IDENTIFIANT DU COMPTEUR
   * ============================================================
   *
   * Cet identifiant correspond au compteur global.
   *
   * IMPORTANT :
   *
   * Si tu veux recommencer la rotation depuis le début,
   * change simplement :
   *
   *     laubes-rotator-v1
   *
   * en :
   *
   *     laubes-rotator-v2
   *
   */


  const COUNTER_KEY =
    "laubes-rotator-v1";


  /*
   * ============================================================
   * URL DE L'API DU COMPTEUR
   * ============================================================
   */


  const COUNTER_API =
    "https://countapi.mileshilliard.com/api/v1/hit/";


  /*
   * ============================================================
   * TEMPS MAXIMUM D'ATTENTE
   * ============================================================
   *
   * Si l'API ne répond pas rapidement,
   * le script utilise automatiquement le fallback.
   *
   * 1500 = 1,5 seconde.
   */


  const API_TIMEOUT =
    1500;


  /*
   * ============================================================
   * FONCTION DE REDIRECTION
   * ============================================================
   */


  async function redirectVisitor() {


    /*
     * ----------------------------------------------------------
     * ÉTAPE 1
     * Tentative d'utilisation du compteur global
     * ----------------------------------------------------------
     */


    try {


      /*
       * Création du contrôleur permettant
       * d'annuler la requête après le délai prévu.
       */


      const controller =
        new AbortController();


      /*
       * Création du délai maximum.
       */


      const timeout =
        setTimeout(
          function () {

            controller.abort();

          },
          API_TIMEOUT
        );


      /*
       * Appel de l'API.
       */


      const response =
        await fetch(

          COUNTER_API +
          encodeURIComponent(
            COUNTER_KEY
          ),

          {

            method: "GET",

            cache: "no-store",

            signal: controller.signal

          }

        );


      /*
       * La réponse est arrivée.
       *
       * On annule donc le timeout.
       */


      clearTimeout(timeout);


      /*
       * Vérification de la réponse.
       */


      if (response.ok) {


        /*
         * Conversion de la réponse en JSON.
         */


        const data =
          await response.json();


        /*
         * Récupération de la valeur
         * du compteur.
         */


        const value =
          parseInt(
            data.value,
            10
          );


        /*
         * Vérification du compteur.
         */


        if (

          Number.isFinite(value) &&
          value > 0

        ) {


          /*
           * ==================================================
           * CALCUL DE L'ARTICLE
           * ==================================================
           *
           * Exemple avec 5 articles :
           *
           * compteur 1 → article 1
           * compteur 2 → article 2
           * compteur 3 → article 3
           * compteur 4 → article 4
           * compteur 5 → article 5
           * compteur 6 → article 1
           * compteur 7 → article 2
           *
           *
           * Avec 50 articles :
           *
           * compteur 1  → article 1
           * compteur 2  → article 2
           * ...
           * compteur 49 → article 49
           * compteur 50 → article 50
           * compteur 51 → article 1
           */


          const index =
            (value - 1) %
            URLS.length;


          /*
           * Récupération de l'URL correspondant
           * au numéro calculé.
           */


          const target =
            URLS[index];


          /*
           * ==================================================
           * REDIRECTION
           * ==================================================
           *
           * replace() remplace la page actuelle
           * dans l'historique du navigateur.
           */


          window.location.replace(
            target
          );


          /*
           * La redirection est terminée.
           */


          return;

        }

      }


    } catch (error) {


      /*
       * ========================================================
       * L'API PRINCIPALE N'A PAS FONCTIONNÉ
       * ========================================================
       *
       * On ne montre aucune erreur au visiteur.
       *
       * On passe simplement au système de secours.
       */


    }


    /*
     * ============================================================
     * ÉTAPE 2 — FALLBACK
     * ============================================================
     *
     * Si le compteur global ne fonctionne pas,
     * on choisit automatiquement un article.
     *
     * Math.random() fonctionne avec n'importe quel nombre
     * d'articles présent dans URLS.
     */


    try {


      /*
       * Génération d'un nombre aléatoire
       * correspondant à un article.
       */


      const randomIndex =
        Math.floor(
          Math.random() *
          URLS.length
        );


      /*
       * Récupération de l'article.
       */


      const randomTarget =
        URLS[randomIndex];


      /*
       * Redirection.
       */


      window.location.replace(
        randomTarget
      );


      return;


    } catch (error) {


      /*
       * ========================================================
       * ÉTAPE 3 — DERNIER RECOURS
       * ========================================================
       *
       * Si une erreur exceptionnelle se produit,
       * on redirige vers le premier article.
       */


      window.location.replace(
        URLS[0]
      );

    }

  }


  /*
   * ============================================================
   * DÉMARRAGE DU SYSTÈME
   * ============================================================
   */


  redirectVisitor();


})();

</script>


</body>

</html>
