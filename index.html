            border-radius: 12px;
            padding: 16px;
            text-align: left;
            margin-bottom: 24px;
            font-size: 0.85rem;
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #1e293b;
        }

        .meta-row:last-child {
            border-bottom: none;
        }

        .meta-label {

        }

        .meta-value {
            font-weight: 600;
            color: #e2e8f0;
        }

        .btn-download {

            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 15px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .btn-download:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-download:active {
            transform: translateY(0);
        }

        .footer-notice {

            font-size: 0.75rem;
            color: var(--text-muted);
